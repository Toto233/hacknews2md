[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hn2md"
dynamic = ["version"]
description = "Hacker News and Product Hunt publishing applications with shared WeChat infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests",
    "certifi",
    "beautifulsoup4>=4.12.0",
    "Pillow",
    "httpx",
    "markdown>=3.4.0",
    "tinycss2>=1.2.1",
    "structlog",
    "click>=8.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
producthunt = []
hackernews = [
    "PySocks",
    "colorama",
    "pillow-avif-plugin",
    "chardet<6",
    "brotli",
    "youtube-transcript-api",
    "twscrape",
    "lxml",
    "google-genai",
    "curl-cffi",
    "selenium",
    "crawl4ai",
    "scrapling",
    "playwright",
    "PyPDF2",
    "pycryptodome",
    "pyperclip",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff",
]

[project.scripts]
hn2md = "hn2md.cli:main"
publisher = "publisher.entrypoint:main"
ph2md = "ph2md.cli:main"

[tool.setuptools.packages.find]
include = ["hn2md*", "ph2md*", "publisher*", "publisher_shared*", "src*", "scripts*"]

[tool.setuptools.dynamic]
version = {attr = "publisher_shared.__version__"}

[tool.setuptools.package-data]
"*" = ["*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
